#cloud-config
# Range host bootstrap: Docker CE + gVisor (runsc) + Python 3.12/uv on Ubuntu
# 24.04. Rendered by Terraform's templatefile — the only interpolated value here
# is tailscale_auth_key; the embedded shell uses $VAR / $(...), which templatefile
# leaves untouched. Idempotent: re-running the script is safe.
package_update: true

write_files:
  - path: /opt/range/bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y ca-certificates curl gnupg lsb-release python3 python3-venv

      # --- Block volume: format if new, mount at /data (nofail so boot never
      # hangs waiting on the paravirtualized disk). Docker data-root lives here so
      # image layers + trace state survive instance recreation.
      ROOT_PART=$(findmnt -n -o SOURCE /)
      ROOT_DISK=$(lsblk -ndo PKNAME "$ROOT_PART")
      DATA_DISK=""
      for d in $(lsblk -dno NAME -e7); do
        if [ "$d" != "$ROOT_DISK" ]; then DATA_DISK="/dev/$d"; break; fi
      done
      if [ -n "$DATA_DISK" ]; then
        if ! blkid "$DATA_DISK" >/dev/null 2>&1; then
          mkfs.ext4 -F "$DATA_DISK"
        fi
        mkdir -p /data
        UUID=$(blkid -s UUID -o value "$DATA_DISK")
        grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /data ext4 defaults,_netdev,nofail 0 2" >> /etc/fstab
        mount -a
      fi
      mkdir -p /data/docker

      # --- Docker CE (official apt repo)
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list

      # --- gVisor runsc (official apt repo); installs to /usr/bin/runsc
      curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" > /etc/apt/sources.list.d/gvisor.list

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin runsc

      # --- Register runsc as a Docker runtime and point data-root at /data.
      # 2.4 may refine runsc flags (e.g. --net-raw); leave that to 2.4.
      cat > /etc/docker/daemon.json <<'EOF'
      {
        "data-root": "/data/docker",
        "runtimes": { "runsc": { "path": "/usr/bin/runsc" } }
      }
      EOF
      systemctl enable docker
      systemctl restart docker
      usermod -aG docker ubuntu

      # --- uv, system-wide so the ubuntu user gets it over non-login SSH.
      curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh

      # --- Optional Tailscale (default off; only runs when an auth key is set).
      TS_KEY="${tailscale_auth_key}"
      if [ -n "$TS_KEY" ]; then
        curl -fsSL https://tailscale.com/install.sh | sh
        tailscale up --authkey="$TS_KEY"
      fi

runcmd:
  - [/opt/range/bootstrap.sh]
